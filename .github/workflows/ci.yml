name: Contract CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            packages/core/package-lock.json
            packages/component-catalog/package-lock.json
            packages/reporter/package-lock.json
            packages/browser-playwright/package-lock.json
            packages/agent-loop/package-lock.json
            packages/test/package-lock.json
            packages/native/package-lock.json
      - run: node ./scripts/check-license-contract.mjs
      - run: ./scripts/check-architecture.sh
      - run: ./scripts/run-framework-p1-tests.sh

  macos:
    name: macOS Swift contracts
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/run-swift-tests.sh

  windows:
    name: Windows host contracts
    runs-on: windows-2022
    defaults:
      run:
        working-directory: native/windows-host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            packages/core/package-lock.json
            packages/component-catalog/package-lock.json
            packages/reporter/package-lock.json
            packages/browser-playwright/package-lock.json
            packages/agent-loop/package-lock.json
            packages/test/package-lock.json
            packages/native/package-lock.json
      - run: dotnet build .\SurfaceLoom.WindowsHost.sln -c Release
      - run: dotnet run --project .\tests\SurfaceLoom.WindowsHost.ContractTests -c Release
      - name: Artifact release contracts
        shell: powershell
        working-directory: .
        run: .\scripts\test-artifact-release.ps1
      - name: TypeScript contracts on Windows
        shell: bash
        working-directory: .
        run: ./scripts/run-typescript-tests.sh
      - name: Clipboard transfer PowerShell AST contracts
        shell: powershell
        working-directory: .
        run: >-
          node --test
          scripts/clipboard-transfer/tests/outbox-and-powershell.test.mjs
          scripts/clipboard-transfer/tests/prepare-cli.test.mjs
          scripts/clipboard-transfer/tests/protocol-plan.test.mjs
          scripts/clipboard-transfer/tests/reference-receiver.test.mjs
